name: Phase 0 and Phase 1 validation
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'PyYAML>=6,<7' 'duckdb>=1.1,<2' 'pandas>=2.2,<3' 'requests>=2.32,<3'
      - run: python -m pytest -q
      - run: python -m ingestion.run_ingestion --db /tmp/phase1-ci.duckdb
